[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dsa"
version = "1.4.0"
description = "Disk Sparse Adam (DSA): an out-of-core sparse Riemannian Adam optimizer for PyTorch"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.8"
authors = [
    { name = "Maksim Khotinsky" }
]
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.21.0"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/Assistentus/DSA"
Repository = "https://github.com/Assistentus/DSA"
Changelog = "https://github.com/Assistentus/DSA/blob/main/CHANGELOG.md"

[tool.setuptools]
packages = ["dsa"]
