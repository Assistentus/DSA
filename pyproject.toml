[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dsa"
version = "0.1.0"
description = "Disk Sparse Adam (DSA): An Out-of-Core Sparse Adam optimizer for PyTorch"
readme = "README.md"
requires-python = ">=3.8"
authors = [
    { name = "Maksim Khotinsky" }
]
dependencies = [
    "torch>=1.12.0",
    "numpy>=1.20.0"
]

[project.urls]
Homepage = "https://github.com/Assistentus/DSA"
Repository = "https://github.com/Assistentus/DSA"
